backend:
  name: github
  repo: naoki213/LEAF
  branch: claude/website-image-mobile-rcahp8
  # ↓ ここを自分で用意した無料の認証プロキシ（Cloudflare Worker）のURLに書き換えてください。
  # 手順はプロジェクトのREADME（CMSセットアップ手順）を参照してください。
  base_url: https://REPLACE-WITH-YOUR-OAUTH-WORKER.workers.dev
  auth_endpoint: auth

locale: ja

media_folder: "assets/images/uploads"
public_folder: "assets/images/uploads"

collections:
  - name: news
    label: "SEOコラム記事"
    label_singular: "記事"
    folder: "_news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "タイトル", name: title, widget: string }
      - { label: "JSON-LD用の見出し（省略時はタイトルと同じ）", name: headline, widget: string, required: false }
      - { label: "ページ上部の見出し（<br>で改行できます）", name: hero_title, widget: string, required: false }
      - { label: "見出し下のリード文", name: hero_lead, widget: string, required: false }
      - { label: "検索結果に表示される説明文（meta description）", name: description, widget: text }
      - { label: "SNSシェア用の説明文（省略可・短め推奨）", name: og_description, widget: text, required: false }
      - { label: "お知らせ一覧に表示する要約", name: excerpt, widget: text }
      - { label: "公開日", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "タグの絵文字", name: tag_icon, widget: string, default: "📝" }
      - { label: "タグ名", name: tag, widget: string, default: "SEOコラム" }
      - { label: "URL（例: /example-page.html の形式で入力）", name: permalink, widget: string }
      - { label: "下部CTAの見出し（省略可）", name: cta_title, widget: string, required: false }
      - { label: "本文", name: body, widget: markdown }

  - name: notices
    label: "お知らせ（短い告知）"
    label_singular: "お知らせ"
    folder: "_notices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "タイトル", name: title, widget: string }
      - { label: "トップページの案内バー用の短いタイトル（省略可）", name: short_title, widget: string, required: false }
      - { label: "本文（お知らせ一覧にそのまま表示されます）", name: excerpt, widget: text }
      - { label: "公開日", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "タグの絵文字", name: tag_icon, widget: string, default: "📢" }
      - { label: "タグ名", name: tag, widget: string, default: "お知らせ" }
