backend:
  name: github
  repo: naoki213/LEAF
  branch: claude/website-image-mobile-rcahp8
  base_url: https://leaf-cms-auth.gamba0412.workers.dev
  auth_endpoint: auth

locale: ja

media_folder: "assets/images/uploads"
public_folder: "assets/images/uploads"

collections:
  - name: news
    label: "管理者ブログ"
    label_singular: "記事"
    folder: "_news"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}{{second}}"
    fields:
      - { label: "タイトル", name: title, widget: string }
      - { label: "公開日", name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]", date_format: "YYYY-MM-DD", time_format: false, default: "{{now}}" }
      - { label: "内容", name: body, widget: markdown }
      - { name: tag_icon, widget: hidden, default: "📝" }
      - { name: tag, widget: hidden, default: "管理者ブログ" }
